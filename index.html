<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<title>Windlog</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Windlog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea: #0F3D3E;
    --sea-deep: #0A2B2C;
    --foam: #F7F9F7;
    --sand: #D9C9A3;
    --rust: #E07A3F;
    --wind: #8FBFBF;
    --offshore: #7FBF7F;
    --onshore: #C97A9E;
    --line: rgba(247,249,247,0.12);
    --text-dim: rgba(247,249,247,0.62);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--sea-deep);
    color: var(--foam);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1,h2,h3, .display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* ---------- Gate screen ---------- */
  #gate{
    position: fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 20%, var(--sea) 0%, var(--sea-deep) 70%);
    padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    z-index: 50;
  }
  .gate-card{ width: 100%; max-width: 360px; text-align:center; }
  .gate-mark{
    font-family:'Fraunces', serif; font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--wind); margin-bottom: 10px;
  }
  .gate-card h1{ font-size: 34px; margin: 0 0 6px; }
  .gate-card p{ color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  #gate input, #nameGate input{
    width:100%; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: rgba(247,249,247,0.06);
