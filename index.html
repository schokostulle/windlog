<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<title>Windlog</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Windlog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea: #0F3D3E;
    --sea-deep: #0A2B2C;
    --foam: #F7F9F7;
    --sand: #D9C9A3;
    --rust: #E07A3F;
    --wind: #8FBFBF;
    --offshore: #7FBF7F;
    --onshore: #C97A9E;
    --line: rgba(247,249,247,0.12);
    --text-dim: rgba(247,249,247,0.62);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--sea-deep);
    color: var(--foam);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1,h2,h3, .display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  /* ---------- Gate screen ---------- */
  #gate{
    position: fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 20%, var(--sea) 0%, var(--sea-deep) 70%);
    padding: 24px;
    z-index: 50;
  }
  .gate-card{ width: 100%; max-width: 360px; text-align:center; }
  .gate-mark{
    font-family:'Fraunces', serif; font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--wind); margin-bottom: 10px;
  }
  .gate-card h1{ font-size: 34px; margin: 0 0 6px; }
  .gate-card p{ color: var(--text-dim); font-size: 14px; margin: 0 0 28px; }
  #gate input, #nameGate input{
    width:100%; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: rgba(247,249,247,0.06);
    color: var(--foam); font-size: 16px; font-family: 'Inter', sans-serif;
    outline:none; margin-bottom: 14px;
  }
  #gate input:focus, #nameGate input:focus{ border-color: var(--wind); }
  #gate button, #nameGate button{
    width:100%; padding: 14px; border-radius: var(--radius); border:none;
    background: var(--rust); color: var(--sea-deep); font-weight: 700;
    font-size: 15px; cursor:pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--wind); outline-offset: 2px;
  }
  #gate-error, #name-error{ color: var(--rust); font-size: 13px; min-height: 18px; margin-top: 10px; }
  #gate-setup-note{ color: var(--text-dim); font-size: 12px; margin-top: 22px; line-height: 1.5; }
  .name-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px; }
  .name-chip{
    padding: 8px 14px; border-radius: 999px; border:1px solid var(--line);
    background: rgba(247,249,247,0.05); color: var(--foam); font-size:13px; cursor:pointer;
  }
  .name-chip:hover{ border-color: var(--wind); }

  /* ---------- App shell ---------- */
  #app{ display:none; padding-bottom: 60px; }
  header.topbar{
    padding: 16px 20px; display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--sea) 0%, var(--sea-deep) 100%);
    position: sticky; top:0; z-index:10;
  }
  header.topbar .brand{ font-family:'Fraunces'; font-size: 20px; }
  header.topbar .who{ color: var(--wind); font-family:'Inter'; font-size: 11px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; }
  .topbar-actions{ display:flex; gap:8px; }
  .topbar-actions button{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    padding: 7px 11px; border-radius: 10px; font-size: 12px; cursor:pointer;
  }

  main{ max-width: 640px; margin: 0 auto; padding: 20px; }

  .rose-card{
    background: rgba(247,249,247,0.04); border: 1px solid var(--line);
    border-radius: 20px; padding: 20px; margin-bottom: 22px;
    display:flex; gap:20px; align-items:center;
  }
  .rose-card svg{ flex-shrink:0; }
  .rose-stats{ flex:1; }
  .rose-stats .big{ font-family:'Fraunces'; font-size: 28px; line-height:1; }
  .rose-stats .lbl{ color: var(--text-dim); font-size: 11.5px; text-transform:uppercase; letter-spacing:0.08em; margin-top:4px;}
  .rose-stats .row{ margin-bottom: 12px; }
  .rose-stats .row:last-child{ margin-bottom:0; }

  .section-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size: 12px; text-transform:uppercase; letter-spacing:0.1em;
    color: var(--wind); margin: 26px 0 12px; font-weight:600;
  }

  #entryForm{
    background: rgba(247,249,247,0.04); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px; margin-bottom: 8px;
  }
  #formTitle{ font-family:'Fraunces'; font-size: 18px; margin: 0 0 14px; }
  .form-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full{ grid-column: 1 / -1; }
  label{ display:block; font-size:11px; color: var(--text-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.06em;}
  input, select, textarea{
    width:100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(10,43,44,0.5); color: var(--foam); font-size: 15px;
    font-family:'Inter'; outline:none;
  }
  textarea{ resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus{ border-color: var(--wind); }
  .shore-toggle{ display:flex; gap:8px; }
  .shore-toggle button{
    flex:1; padding: 11px; border-radius: 10px; border:1px solid var(--line);
    background: rgba(10,43,44,0.5); color: var(--text-dim); font-size: 13px; cursor:pointer;
  }
  .shore-toggle button.active[data-v="ablandig"]{ background: var(--offshore); color: var(--sea-deep); border-color: var(--offshore); font-weight:700;}
  .shore-toggle button.active[data-v="auflandig"]{ background: var(--onshore); color: var(--sea-deep); border-color: var(--onshore); font-weight:700;}
  .stars{ display:flex; gap:6px; font-size:22px; margin-top:4px; }
  .stars span{ cursor:pointer; opacity:0.3; }
  .stars span.active{ opacity:1; }
  .form-actions{ display:flex; gap:10px; margin-top: 14px; }
  #saveBtn{
    flex:1; padding: 13px; border-radius: 10px; border:none; background: var(--rust);
    color: var(--sea-deep); font-weight:700; font-size: 15px; cursor:pointer;
  }
  #cancelEditBtn{
    display:none; padding: 13px 16px; border-radius: 10px; border:1px solid var(--line);
    background:none; color: var(--text-dim); font-size: 14px; cursor:pointer;
  }

  select#filterUser{
    max-width: 180px; padding: 7px 10px; font-size: 12.5px; border-radius: 10px;
  }

  .entry{
    border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
    margin-bottom: 10px; display:flex; justify-content:space-between; gap: 12px; cursor:pointer;
  }
  .entry:hover{ border-color: var(--wind); }
  .entry .left{ flex:1; }
  .entry .spot{ font-family:'Fraunces'; font-size:17px; }
  .entry .who-tag{
    display:inline-block; font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color: var(--sea-deep); background: var(--sand); padding: 2px 8px; border-radius:999px;
    margin-left: 8px; vertical-align: middle;
  }
  .entry .meta{ color: var(--text-dim); font-size: 12.5px; margin-top: 5px; line-height:1.5;}
  .entry .shore-tag{ font-weight:600; }
  .entry .shore-tag.ablandig{ color: var(--offshore); }
  .entry .shore-tag.auflandig{ color: var(--onshore); }
  .entry .notes{ font-size: 13px; margin-top:6px; color: rgba(247,249,247,0.85); }
  .entry .right{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .entry .stars-display{ font-size:13px; color: var(--sand); }
  .entry .delBtn{ background:none; border:none; color: var(--text-dim); font-size:12px; cursor:pointer; padding:2px 4px;}
  .empty{ text-align:center; color: var(--text-dim); font-size: 14px; padding: 30px 10px; }
  .loading{ text-align:center; color: var(--text-dim); font-size: 13px; padding: 20px; }

  /* View toggle */
  .view-toggle{ display:flex; gap:6px; }
  .view-toggle button{
    background: rgba(247,249,247,0.05); border:1px solid var(--line); color: var(--text-dim);
    padding: 6px 11px; border-radius: 8px; font-size: 12px; cursor:pointer;
  }
  .view-toggle button.active{ background: var(--wind); color: var(--sea-deep); border-color: var(--wind); font-weight:700; }

  /* Comparison table */
  .table-wrap{ overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; -webkit-overflow-scrolling: touch; }
  table.cmp{ border-collapse: collapse; width: 100%; min-width: 720px; font-size: 12.5px; }
  table.cmp th, table.cmp td{ padding: 10px 12px; text-align: left; white-space: nowrap; }
  table.cmp thead th{
    position: sticky; top:0; background: var(--sea); color: var(--wind);
    font-size: 10.5px; text-transform: uppercase; letter-spacing:0.05em; cursor:pointer;
    border-bottom: 1px solid var(--line); user-select:none;
  }
  table.cmp thead th:hover{ color: var(--foam); }
  table.cmp thead th .arrow{ opacity:0.6; margin-left:3px; }
  table.cmp tbody tr{ border-bottom: 1px solid var(--line); cursor:pointer; }
  table.cmp tbody tr:hover{ background: rgba(247,249,247,0.04); }
  table.cmp tbody tr:last-child{ border-bottom:none; }
  table.cmp td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  table.cmp td.who{ color: var(--sand); }
  table.cmp td.shore-ablandig{ color: var(--offshore); font-weight:600; }
  table.cmp td.shore-auflandig{ color: var(--onshore); font-weight:600; }
  table.cmp td.stars-cell{ color: var(--sand); letter-spacing:1px; }
  table.cmp td.notes-cell{ white-space: normal; min-width: 160px; max-width: 240px; color: rgba(247,249,247,0.8); }
  table.cmp .del-icon{ background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:13px; padding:2px 6px; }
  .sync-note{ text-align:center; color: var(--text-dim); font-size: 11px; margin-top: 18px; }

  @media (max-width: 420px){
    .rose-card{ flex-direction:column; }
    .form-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-mark">✦ Windlog</div>
    <h1>Erst das Passwort,<br>dann der Wind.</h1>
    <p>Euer gemeinsames Surf-Tagebuch.</p>
    <input type="password" id="pwInput" placeholder="Passwort" autocomplete="current-password">
    <button id="unlockBtn">Entsperren</button>
    <div id="gate-error"></div>
    <div id="gate-setup-note"></div>
    <div id="gate-connection-warning" style="display:none; color: var(--rust); font-size: 12px; margin-top: 16px; line-height:1.5; border-top: 1px solid var(--line); padding-top: 14px;"></div>
  </div>
</div>

<div id="nameGate" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; background: radial-gradient(ellipse at 50% 20%, var(--sea) 0%, var(--sea-deep) 70%); padding:24px; z-index:45;">
  <div class="gate-card">
    <div class="gate-mark">✦ Windlog</div>
    <h1>Wer bist du?</h1>
    <p>Dein Name erscheint an deinen Einträgen.</p>
    <div class="name-chips" id="nameChips"></div>
    <input type="text" id="nameInput" placeholder="Name eingeben">
    <button id="setNameBtn">Weiter</button>
    <div id="name-error"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">Windlog</div>
      <div class="who" id="whoLabel"></div>
    </div>
    <div class="topbar-actions">
      <button id="switchUserBtn">Name ändern</button>
      <button id="lockBtn">Sperren</button>
    </div>
  </header>

  <main>
    <div class="rose-card">
      <svg id="roseSvg" width="120" height="120" viewBox="0 0 120 120"></svg>
      <div class="rose-stats">
        <div class="row">
          <div class="big" id="statAvgWind">–</div>
          <div class="lbl">Ø Windstärke (kn)</div>
        </div>
        <div class="row">
          <div class="big" id="statSessions">0</div>
          <div class="lbl">Sessions geloggt</div>
        </div>
      </div>
    </div>

    <div class="section-title"><span id="formTitleLabel">Neue Session</span></div>
    <form id="entryForm">
      <div class="form-grid">
        <div>
          <label for="fDate">Datum</label>
          <input type="date" id="fDate" required>
        </div>
        <div>
          <label for="fSpot">Spot</label>
          <input type="text" id="fSpot" placeholder="z.B. Westerland" required>
        </div>
        <div>
          <label for="fWind">Wind (kn)</label>
          <input type="number" id="fWind" min="0" max="80" placeholder="18">
        </div>
        <div>
          <label for="fGust">Böen (kn)</label>
          <input type="number" id="fGust" min="0" max="90" placeholder="24">
        </div>
        <div>
          <label for="fDir">Windrichtung</label>
          <select id="fDir">
            <option value="">–</option>
            <option>N</option><option>NO</option><option>O</option><option>SO</option>
            <option>S</option><option>SW</option><option>W</option><option>NW</option>
          </select>
        </div>
        <div>
          <label>Ablandig / Auflandig</label>
          <div class="shore-toggle" id="shoreToggle">
            <button type="button" data-v="ablandig">Ablandig</button>
            <button type="button" data-v="auflandig">Auflandig</button>
          </div>
        </div>
        <div>
          <label for="fWing">Wing (m²)</label>
          <input type="number" id="fWing" min="0" max="30" step="0.1" placeholder="4.5">
        </div>
        <div>
          <label for="fBoard">Board (L)</label>
          <input type="number" id="fBoard" min="0" max="300" placeholder="90">
        </div>
        <div class="full">
          <label>Bewertung</label>
          <div class="stars" id="starPicker">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </div>
        <div class="full">
          <label for="fNotes">Notizen</label>
          <textarea id="fNotes" placeholder="Bedingungen, Gefühl, was beim nächsten Mal anders..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" id="saveBtn">Session speichern</button>
        <button type="button" id="cancelEditBtn">Abbrechen</button>
      </div>
    </form>

    <div class="section-title">
      <span>Verlauf</span>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <select id="filterUser"><option value="">Alle Benutzer</option></select>
        <div class="view-toggle">
          <button type="button" id="viewCardsBtn" class="active">Karten</button>
          <button type="button" id="viewTableBtn">Tabelle</button>
        </div>
      </div>
    </div>
    <div id="entriesList"><div class="loading">Lade Einträge…</div></div>
    <div class="sync-note">Einträge werden live mit allen geteilt.</div>
  </main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- Config / Supabase ---------------- */
let supabaseClient = null;
let supabaseInitError = '';
try{
  if(!window.SUPABASE_URL || window.SUPABASE_URL.includes('DEIN-PROJEKT')){
    supabaseInitError = 'config.js ist noch nicht ausgefüllt (Supabase-URL fehlt).';
  } else if(!window.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY.includes('DEIN-ANON-KEY')){
    supabaseInitError = 'config.js ist noch nicht ausgefüllt (Supabase-Key fehlt).';
  } else if(!window.supabase || !window.supabase.createClient){
    supabaseInitError = 'Die Supabase-Bibliothek konnte nicht geladen werden (evtl. Ad-/Script-Blocker oder keine Internetverbindung).';
  } else {
    supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  }
} catch(err){
  supabaseInitError = 'Supabase-Verbindung fehlgeschlagen: ' + err.message;
}
if(supabaseInitError){
  console.error(supabaseInitError);
  const warnEl = document.getElementById('gate-connection-warning');
  warnEl.textContent = '⚠ ' + supabaseInitError + ' Das Passwort funktioniert trotzdem, aber Einträge können erst geladen werden, sobald das behoben ist.';
  warnEl.style.display = 'block';
}

function requireSupabase(){
  if(!supabaseClient) throw new Error(supabaseInitError || 'Keine Datenbankverbindung.');
  return supabaseClient;
}

const PW_HASH_KEY = 'windlog_pw_hash_v1';
const SESSION_KEY = 'windlog_unlocked';
const USERNAME_KEY = 'windlog_username_v1';

/* ---------------- Crypto helpers ---------------- */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- Password gate ---------------- */
const gate = document.getElementById('gate');
const nameGate = document.getElementById('nameGate');
const app = document.getElementById('app');
const pwInput = document.getElementById('pwInput');
const gateError = document.getElementById('gate-error');
const setupNote = document.getElementById('gate-setup-note');

function hasStoredPw(){ return !!localStorage.getItem(PW_HASH_KEY); }
function refreshGateCopy(){
  setupNote.textContent = hasStoredPw() ? '' : 'Noch kein Passwort auf diesem Gerät gesetzt — was du hier eingibst, wird zum Passwort. Nutze dasselbe Wort auf allen Geräten.';
}
refreshGateCopy();

async function tryUnlock(){
  const val = pwInput.value;
  if(!val){ gateError.textContent = 'Bitte Passwort eingeben.'; return; }
  const hash = await sha256(val);
  if(!hasStoredPw()){
    localStorage.setItem(PW_HASH_KEY, hash);
    afterUnlock();
    return;
  }
  if(hash === localStorage.getItem(PW_HASH_KEY)){
    sessionStorage.setItem(SESSION_KEY, '1');
    afterUnlock();
  } else {
    gateError.textContent = 'Falsches Passwort.';
    pwInput.value = '';
  }
}

document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

document.getElementById('lockBtn').addEventListener('click', () => {
  sessionStorage.removeItem(SESSION_KEY);
  app.style.display = 'none';
  gate.style.display = 'flex';
  pwInput.value = '';
  pwInput.focus();
});

function afterUnlock(){
  gate.style.display = 'none';
  gateError.textContent = '';
  const savedName = localStorage.getItem(USERNAME_KEY);
  if(savedName){
    enterApp(savedName);
  } else {
    showNameGate();
  }
}

if(sessionStorage.getItem(SESSION_KEY) === '1' && hasStoredPw()){
  afterUnlock();
}

/* ---------------- Name gate ---------------- */
const nameInput = document.getElementById('nameInput');
const nameError = document.getElementById('name-error');
const nameChips = document.getElementById('nameChips');

async function showNameGate(){
  nameGate.style.display = 'flex';
  nameError.textContent = '';
  nameInput.value = '';
  await populateNameChips();
}

async function populateNameChips(){
  nameChips.innerHTML = '';
  try{
    const { data, error } = await requireSupabase().from('entries').select('username');
    if(error) throw error;
    const names = [...new Set(data.map(r => r.username))].filter(Boolean).sort();
    names.forEach(n => {
      const chip = document.createElement('div');
      chip.className = 'name-chip';
      chip.textContent = n;
      chip.addEventListener('click', () => { nameInput.value = n; });
      nameChips.appendChild(chip);
    });
  } catch(e){ /* silently ignore, chips are just a convenience */ }
}

document.getElementById('setNameBtn').addEventListener('click', () => {
  const val = nameInput.value.trim();
  if(!val){ nameError.textContent = 'Bitte einen Namen eingeben.'; return; }
  localStorage.setItem(USERNAME_KEY, val);
  nameGate.style.display = 'none';
  enterApp(val);
});
nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('setNameBtn').click(); });

document.getElementById('switchUserBtn').addEventListener('click', () => {
  app.style.display = 'none';
  showNameGate();
});

/* ---------------- Enter app ---------------- */
let currentUsername = '';

function enterApp(name){
  currentUsername = name;
  document.getElementById('whoLabel').textContent = 'Angemeldet als ' + name;
  app.style.display = 'block';
  loadAndRender();
  subscribeRealtime();
}

/* ---------------- Star picker ---------------- */
let currentRating = 0;
const starPicker = document.getElementById('starPicker');
starPicker.querySelectorAll('span').forEach(s => {
  s.addEventListener('click', () => { currentRating = parseInt(s.dataset.v); updateStarDisplay(); });
});
function updateStarDisplay(){
  starPicker.querySelectorAll('span').forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= currentRating));
}

/* ---------------- Shore toggle ---------------- */
let currentShore = '';
const shoreToggle = document.getElementById('shoreToggle');
shoreToggle.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    currentShore = (currentShore === b.dataset.v) ? '' : b.dataset.v;
    shoreToggle.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.v === currentShore));
  });
});

/* ---------------- Form state ---------------- */
let editingId = null;
const form = document.getElementById('entryForm');
const cancelEditBtn = document.getElementById('cancelEditBtn');
document.getElementById('fDate').valueAsDate = new Date();

function resetForm(){
  form.reset();
  document.getElementById('fDate').valueAsDate = new Date();
  currentRating = 0; updateStarDisplay();
  currentShore = ''; shoreToggle.querySelectorAll('button').forEach(x => x.classList.remove('active'));
  editingId = null;
  document.getElementById('formTitleLabel').textContent = 'Neue Session';
  document.getElementById('saveBtn').textContent = 'Session speichern';
  cancelEditBtn.style.display = 'none';
}

function fillFormForEdit(entry){
  editingId = entry.id;
  document.getElementById('fDate').value = entry.entry_date || '';
  document.getElementById('fSpot').value = entry.spot || '';
  document.getElementById('fWind').value = entry.wind_kn ?? '';
  document.getElementById('fGust').value = entry.gust_kn ?? '';
  document.getElementById('fDir').value = entry.wind_direction || '';
  document.getElementById('fWing').value = entry.wing_m2 ?? '';
  document.getElementById('fBoard').value = entry.board_l ?? '';
  document.getElementById('fNotes').value = entry.notes || '';
  currentRating = entry.rating || 0; updateStarDisplay();
  currentShore = entry.shore || '';
  shoreToggle.querySelectorAll('button').forEach(x => x.classList.toggle('active', x.dataset.v === currentShore));
  document.getElementById('formTitleLabel').textContent = 'Session bearbeiten';
  document.getElementById('saveBtn').textContent = 'Änderungen speichern';
  cancelEditBtn.style.display = 'inline-block';
  form.scrollIntoView({behavior:'smooth', block:'start'});
}

cancelEditBtn.addEventListener('click', resetForm);

form.addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    username: currentUsername,
    entry_date: document.getElementById('fDate').value,
    spot: document.getElementById('fSpot').value.trim(),
    wind_kn: numOrNull(document.getElementById('fWind').value),
    gust_kn: numOrNull(document.getElementById('fGust').value),
    wind_direction: document.getElementById('fDir').value || null,
    shore: currentShore || null,
    wing_m2: numOrNull(document.getElementById('fWing').value),
    board_l: numOrNull(document.getElementById('fBoard').value),
    rating: currentRating,
    notes: document.getElementById('fNotes').value.trim() || null
  };
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  try{
    if(editingId){
      const { error } = await requireSupabase().from('entries').update(payload).eq('id', editingId);
      if(error) throw error;
    } else {
      const { error } = await requireSupabase().from('entries').insert([payload]);
      if(error) throw error;
    }
    resetForm();
    await loadAndRender();
  } catch(err){
    alert('Speichern fehlgeschlagen: ' + err.message);
  } finally {
    saveBtn.disabled = false;
  }
});

function numOrNull(v){ return v === '' || v === null || v === undefined ? null : parseFloat(v); }

/* ---------------- Data loading ---------------- */
let allEntries = [];

async function loadAndRender(){
  const list = document.getElementById('entriesList');
  try{
    const { data, error } = await requireSupabase()
      .from('entries')
      .select('*')
      .order('entry_date', { ascending: false })
      .order('created_at', { ascending: false });
    if(error) throw error;
    allEntries = data || [];
    populateUserFilter(allEntries);
    renderAll(getFilteredEntries());
  } catch(err){
    list.innerHTML = `<div class="empty">Konnte Einträge nicht laden: ${escapeHtml(err.message)}<br>Prüfe config.js (Supabase-URL/Key) und deine Internetverbindung.</div>`;
  }
}

function getFilteredEntries(){
  const filter = document.getElementById('filterUser').value;
  return filter ? allEntries.filter(e => e.username === filter) : allEntries;
}

function populateUserFilter(entries){
  const sel = document.getElementById('filterUser');
  const current = sel.value;
  const names = [...new Set(entries.map(e => e.username))].filter(Boolean).sort();
  sel.innerHTML = '<option value="">Alle Benutzer</option>' + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if(names.includes(current)) sel.value = current;
}
document.getElementById('filterUser').addEventListener('change', () => renderAll(getFilteredEntries()));

/* ---------------- View mode (Karten / Tabelle) ---------------- */
const VIEW_KEY = 'windlog_view_mode';
let viewMode = localStorage.getItem(VIEW_KEY) === 'table' ? 'table' : 'cards';
const viewCardsBtn = document.getElementById('viewCardsBtn');
const viewTableBtn = document.getElementById('viewTableBtn');
function setViewMode(mode){
  viewMode = mode;
  localStorage.setItem(VIEW_KEY, mode);
  viewCardsBtn.classList.toggle('active', mode === 'cards');
  viewTableBtn.classList.toggle('active', mode === 'table');
  renderList(sortEntries(getFilteredEntries()));
}
viewCardsBtn.addEventListener('click', () => setViewMode('cards'));
viewTableBtn.addEventListener('click', () => setViewMode('table'));
viewCardsBtn.classList.toggle('active', viewMode === 'cards');
viewTableBtn.classList.toggle('active', viewMode === 'table');

/* ---------------- Sorting (for table view, to make comparison easy) ---------------- */
let sortKey = 'entry_date';
let sortDir = 'desc';
const TABLE_COLUMNS = [
  { key: 'entry_date', label: 'Datum' },
  { key: 'username', label: 'Name' },
  { key: 'spot', label: 'Spot' },
  { key: 'wind_kn', label: 'Wind (kn)', num: true },
  { key: 'gust_kn', label: 'Böen (kn)', num: true },
  { key: 'wind_direction', label: 'Richtung' },
  { key: 'shore', label: 'A/A' },
  { key: 'wing_m2', label: 'Wing (m²)', num: true },
  { key: 'board_l', label: 'Board (L)', num: true },
  { key: 'rating', label: '★', num: true },
  { key: 'notes', label: 'Notizen' }
];
function sortEntries(entries){
  const col = TABLE_COLUMNS.find(c => c.key === sortKey);
  const sorted = [...entries].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(col && col.num){ av = parseFloat(av) || -Infinity; bv = parseFloat(bv) || -Infinity; }
    else { av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase(); }
    if(av < bv) return sortDir === 'asc' ? -1 : 1;
    if(av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}

/* ---------------- Realtime ---------------- */
function subscribeRealtime(){
  if(!supabaseClient) return; // Fehler wurde bereits beim Laden angezeigt
  supabaseClient
    .channel('entries-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, () => {
      loadAndRender();
    })
    .subscribe();
}

/* ---------------- Rendering ---------------- */
function renderRose(entries){
  const svg = document.getElementById('roseSvg');
  const cx = 60, cy = 60, maxR = 46;
  const dirs = ['N','NO','O','SO','S','SW','W','NW'];
  const counts = {}; dirs.forEach(d => counts[d] = 0);
  let totalWithDir = 0;
  entries.forEach(en => { if(en.wind_direction && counts[en.wind_direction] !== undefined){ counts[en.wind_direction]++; totalWithDir++; } });
  const maxCount = Math.max(1, ...Object.values(counts));

  let svgContent = `<circle cx="${cx}" cy="${cy}" r="${maxR}" fill="none" stroke="rgba(247,249,247,0.1)" stroke-width="1"/>`;
  svgContent += `<circle cx="${cx}" cy="${cy}" r="${maxR*0.5}" fill="none" stroke="rgba(247,249,247,0.07)" stroke-width="1"/>`;

  dirs.forEach((d,i) => {
    const angleDeg = -90 + i * 45;
    const angleRad = angleDeg * Math.PI/180;
    const r = totalWithDir ? (counts[d]/maxCount) * maxR : 0;
    const x = cx + r * Math.cos(angleRad);
    const y = cy + r * Math.sin(angleRad);
    if(r > 2){
      svgContent += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E07A3F" stroke-width="7" stroke-linecap="round" opacity="0.85"/>`;
    }
    const lx = cx + (maxR+12) * Math.cos(angleRad);
    const ly = cy + (maxR+12) * Math.sin(angleRad);
    svgContent += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="rgba(247,249,247,0.55)" font-size="9" font-family="Inter" text-anchor="middle" dominant-baseline="middle">${d}</text>`;
  });
  svg.innerHTML = svgContent;
}

function renderStats(entries){
  const winds = entries.map(e => parseFloat(e.wind_kn)).filter(v => !isNaN(v));
  const avg = winds.length ? (winds.reduce((a,b)=>a+b,0)/winds.length).toFixed(1) : '–';
  document.getElementById('statAvgWind').textContent = avg;
  document.getElementById('statSessions').textContent = entries.length;
}

function renderList(entries){
  const list = document.getElementById('entriesList');
  if(!entries.length){
    list.innerHTML = '<div class="empty">Noch keine Sessions geloggt. Trag oben die erste ein.</div>';
    return;
  }
  if(viewMode === 'table'){
    renderTable(entries, list);
  } else {
    renderCards(entries, list);
  }
}

function renderCards(entries, list){
  list.innerHTML = entries.map(en => {
    const dateFmt = en.entry_date ? new Date(en.entry_date + 'T00:00:00').toLocaleDateString('de-DE', {day:'numeric', month:'short', year:'numeric'}) : '';
    const metaParts = [];
    if(en.wind_kn) metaParts.push(`${en.wind_kn} kn${en.gust_kn ? ' (Böen ' + en.gust_kn + ')' : ''}`);
    if(en.wind_direction) metaParts.push(en.wind_direction);
    if(en.shore) metaParts.push(`<span class="shore-tag ${en.shore}">${en.shore === 'ablandig' ? 'Ablandig' : 'Auflandig'}</span>`);
    if(en.wing_m2) metaParts.push(en.wing_m2 + ' m² Wing');
    if(en.board_l) metaParts.push(en.board_l + ' L Board');
    return `
      <div class="entry" data-id="${en.id}">
        <div class="left">
          <div class="spot">${escapeHtml(en.spot || 'Unbekannter Spot')}<span class="who-tag">${escapeHtml(en.username || '?')}</span></div>
          <div class="meta">${dateFmt}${metaParts.length ? ' · ' + metaParts.join(' · ') : ''}</div>
          ${en.notes ? `<div class="notes">${escapeHtml(en.notes)}</div>` : ''}
        </div>
        <div class="right">
          <div class="stars-display">${'★'.repeat(en.rating||0)}${'☆'.repeat(5-(en.rating||0))}</div>
          <button class="delBtn" data-del="${en.id}">Löschen</button>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.entry').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('.delBtn')) return;
      const entry = allEntries.find(x => String(x.id) === el.dataset.id);
      if(entry) fillFormForEdit(entry);
    });
  });
  list.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm('Diese Session wirklich löschen?')) return;
      try{
        const { error } = await requireSupabase().from('entries').delete().eq('id', btn.dataset.del);
        if(error) throw error;
      } catch(err){ alert('Löschen fehlgeschlagen: ' + err.message); return; }
      await loadAndRender();
    });
  });
}

function renderTable(entries, list){
  const headerHtml = TABLE_COLUMNS.map(c => {
    const arrow = sortKey === c.key ? (sortDir === 'asc' ? '▲' : '▼') : '';
    return `<th data-key="${c.key}">${c.label}${arrow ? `<span class="arrow">${arrow}</span>` : ''}</th>`;
  }).join('') + '<th></th>';

  const rowsHtml = entries.map(en => {
    const dateFmt = en.entry_date ? new Date(en.entry_date + 'T00:00:00').toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'}) : '–';
    const shoreLabel = en.shore ? (en.shore === 'ablandig' ? 'Abl.' : 'Aufl.') : '–';
    const shoreClass = en.shore ? 'shore-' + en.shore : '';
    return `
      <tr data-id="${en.id}">
        <td>${dateFmt}</td>
        <td class="who">${escapeHtml(en.username || '?')}</td>
        <td>${escapeHtml(en.spot || '–')}</td>
        <td class="num">${en.wind_kn ?? '–'}</td>
        <td class="num">${en.gust_kn ?? '–'}</td>
        <td>${en.wind_direction || '–'}</td>
        <td class="${shoreClass}">${shoreLabel}</td>
        <td class="num">${en.wing_m2 ?? '–'}</td>
        <td class="num">${en.board_l ?? '–'}</td>
        <td class="stars-cell">${'★'.repeat(en.rating||0)}${'☆'.repeat(5-(en.rating||0))}</td>
        <td class="notes-cell">${en.notes ? escapeHtml(en.notes) : ''}</td>
        <td><button class="del-icon" data-del="${en.id}" title="Löschen">✕</button></td>
      </tr>`;
  }).join('');

  list.innerHTML = `<div class="table-wrap"><table class="cmp"><thead><tr>${headerHtml}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;

  list.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if(sortKey === key){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortKey = key; sortDir = 'asc'; }
      renderList(sortEntries(getFilteredEntries()));
    });
  });
  list.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', (e) => {
      if(e.target.closest('.del-icon')) return;
      const entry = allEntries.find(x => String(x.id) === tr.dataset.id);
      if(entry) fillFormForEdit(entry);
    });
  });
  list.querySelectorAll('.del-icon').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm('Diese Session wirklich löschen?')) return;
      try{
        const { error } = await requireSupabase().from('entries').delete().eq('id', btn.dataset.del);
        if(error) throw error;
      } catch(err){ alert('Löschen fehlgeschlagen: ' + err.message); return; }
      await loadAndRender();
    });
  });
}

function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(entries){
  renderRose(entries);
  renderStats(entries);
  renderList(sortEntries(entries));
}

/* ---------------- Service worker registration ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
